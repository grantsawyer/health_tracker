# Scans every commit for coding-agent settings files and credential patterns (scripts/check-secrets.mjs --history).
# Catches what a local check can miss: commits made from another clone or machine, where Claude Code's global
# gitignore for .claude/settings.local.json doesn't exist. Contains no private data; the owner-specific check
# (check-privacy.mjs) runs locally before every commit.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit is still published
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-secrets.mjs --history
      - run: node scripts/check-secrets.mjs
